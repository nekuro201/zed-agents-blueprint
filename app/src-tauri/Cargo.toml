[package]
name = "pi-factory"
version = "0.1.0"
description = "Pi Factory — fábrica de software autônoma para desktop (Tauri 2 + React + @earendil-works/pi-coding-agent)"
authors = ["Pi Factory"]
edition = "2021"

# O app Tauri v2 expõe uma lib (staticlib/cdylib) consumida pelo binário.
[lib]
name = "pi_factory_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
